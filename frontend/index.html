<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      id="meta-description"
      name="description"
      content="Карта экологических происшествий в Черноморском регионе"
    />
    <title>Экомонитор Чёрного моря</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <div class="eyebrow" data-i18n="site.eyebrow">
            ЭКОЛОГИЧЕСКАЯ АНАЛИТИКА
          </div>
          <h1 data-i18n="site.title">Экомонитор Чёрного моря</h1>
        </div>

        <div class="topbar-actions">
          <div
            id="language-switch"
            class="language-switch"
            role="group"
            aria-label="Язык интерфейса"
            data-i18n-aria-label="language.label"
          >
            <button
              class="language-switch__button"
              type="button"
              data-language="ru"
              aria-pressed="true"
              title="Русский"
            >
              RU
            </button>
            <button
              class="language-switch__button"
              type="button"
              data-language="en"
              aria-pressed="false"
              title="English"
            >
              EN
            </button>
          </div>

          <div class="monitor-status" aria-live="polite">
            <span id="connection-dot" class="status-dot status-dot--loading"></span>
            <div>
              <div id="connection-label">Подключение…</div>
              <div id="update-label" class="status-subline">Ожидание API</div>
            </div>
          </div>
        </div>
      </header>

      <main class="map-shell">
        <div
          id="map"
          aria-label="Карта экологических происшествий Черноморского региона"
          data-i18n-aria-label="map.aria"
        ></div>

        <aside
          class="filter-panel"
          aria-label="Фильтры событий"
          data-i18n-aria-label="filters.aria"
        >
          <div class="filter-panel__head">
            <div>
              <div class="filter-kicker" data-i18n="filters.kicker">ФИЛЬТРЫ</div>
              <div class="filter-title" data-i18n="filters.title">События</div>
            </div>
            <button
              id="reset-filters"
              class="filter-reset"
              type="button"
              data-i18n="filters.reset"
            >
              Сбросить
            </button>
          </div>

          <div class="filter-section">
            <div class="filter-section__title" data-i18n="filters.status">СТАТУС</div>
            <label class="filter-check">
              <input type="checkbox" data-status="detected" checked />
              <span data-i18n="status.detected">Обнаружено</span>
            </label>
            <label class="filter-check">
              <input type="checkbox" data-status="active" checked />
              <span data-i18n="status.active">Активно</span>
            </label>
            <label class="filter-check">
              <input type="checkbox" data-status="contained" checked />
              <span data-i18n="status.contained">Локализовано</span>
            </label>
            <label class="filter-check">
              <input type="checkbox" data-status="resolved" checked />
              <span data-i18n="status.resolved">Завершено</span>
            </label>
          </div>

          <div class="filter-section">
            <div class="filter-section__title" data-i18n="filters.category">КАТЕГОРИЯ</div>
            <label class="filter-check">
              <input type="checkbox" data-category="wildfire" checked />
              <span class="filter-dot" style="--filter-color:#ff9f43"></span>
              <span data-i18n="category.wildfire">Лесной пожар</span>
            </label>
            <label class="filter-check">
              <input type="checkbox" data-category="industrial_fire" checked />
              <span class="filter-dot" style="--filter-color:#ff5d5d"></span>
              <span data-i18n="category.industrial_fire">Промышленный пожар</span>
            </label>
            <label class="filter-check">
              <input type="checkbox" data-category="oil_spill" checked />
              <span class="filter-dot" style="--filter-color:#6f8cff"></span>
              <span data-i18n="category.oil_spill">Разлив нефти</span>
            </label>
            <label class="filter-check">
              <input type="checkbox" data-category="water_pollution" checked />
              <span class="filter-dot" style="--filter-color:#46d7c8"></span>
              <span data-i18n="category.water_pollution">Загрязнение воды</span>
            </label>

            <details class="more-categories">
              <summary data-i18n="filters.moreCategories">Другие категории</summary>
              <label class="filter-check">
                <input type="checkbox" data-category="algae_bloom" checked />
                <span class="filter-dot" style="--filter-color:#8bd96b"></span>
                <span data-i18n="category.algae_bloom">Цветение водорослей</span>
              </label>
              <label class="filter-check">
                <input type="checkbox" data-category="marine_animal_death" checked />
                <span class="filter-dot" style="--filter-color:#bd7cff"></span>
                <span data-i18n="category.marine_animal_death">Гибель морских животных</span>
              </label>
              <label class="filter-check">
                <input type="checkbox" data-category="chemical_release" checked />
                <span class="filter-dot" style="--filter-color:#f2d95c"></span>
                <span data-i18n="category.chemical_release">Химический выброс</span>
              </label>
              <label class="filter-check">
                <input type="checkbox" data-category="storm_damage" checked />
                <span class="filter-dot" style="--filter-color:#84b6ff"></span>
                <span data-i18n="category.storm_damage">Штормовой ущерб</span>
              </label>
            </details>
          </div>

          <div class="filter-section">
            <div class="filter-section__title" data-i18n="filters.timeWindow">ПЕРИОД</div>
            <div
              class="time-segmented"
              role="radiogroup"
              aria-label="Период времени"
              data-i18n-aria-label="filters.timeWindowAria"
            >
              <label>
                <input type="radio" name="time-window" value="1" />
                <span data-i18n="filters.24h">24 Ч</span>
              </label>
              <label>
                <input type="radio" name="time-window" value="7" checked />
                <span data-i18n="filters.7d">7 Д</span>
              </label>
              <label>
                <input type="radio" name="time-window" value="30" />
                <span data-i18n="filters.30d">30 Д</span>
              </label>
              <label>
                <input type="radio" name="time-window" value="all" />
                <span data-i18n="filters.all">ВСЁ</span>
              </label>
            </div>
            <div class="filter-note" data-i18n="filters.timeNote">
              Период определяется по времени инцидента, затем публикации и обнаружения.
            </div>
          </div>
        </aside>

        <aside
          id="event-panel"
          class="event-panel"
          aria-label="Информация о выбранном событии"
          data-i18n-aria-label="panel.aria"
          aria-hidden="true"
        >
          <button
            id="close-event-panel"
            class="event-panel__close"
            type="button"
            aria-label="Закрыть информацию о событии"
            data-i18n-aria-label="panel.close"
          >
            ×
          </button>
          <div id="event-panel-content"></div>
        </aside>

        <section
          class="map-legend"
          aria-label="Легенда событий"
          data-i18n-aria-label="legend.aria"
        >
          <div class="legend-title" data-i18n="legend.title">СОБЫТИЯ</div>
          <div class="legend-row">
            <span class="legend-swatch" style="--swatch:#ff5d5d"></span>
            <span data-i18n="category.industrial_fire">Промышленный пожар</span>
          </div>
          <div class="legend-row">
            <span class="legend-swatch" style="--swatch:#ff9f43"></span>
            <span data-i18n="category.wildfire">Лесной пожар</span>
          </div>
          <div class="legend-row">
            <span class="legend-swatch" style="--swatch:#6f8cff"></span>
            <span data-i18n="category.oil_spill">Разлив нефти</span>
          </div>
          <div class="legend-row">
            <span class="legend-swatch" style="--swatch:#46d7c8"></span>
            <span data-i18n="category.water_pollution">Загрязнение воды</span>
          </div>
        </section>

        <div id="event-count" class="event-count">0 событий</div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
